# ---------------------------------------------------------
# ЗАДАНИЕ 5: СОБСТВЕННЫЕ ПРАВИЛА WAF (ParTricle)
# ---------------------------------------------------------

# Правило 1: Разрешить SQLi в GET параметре с localhost (127.0.0.1), запретить с других
# Отключаем правило CRS 942100 (SQL Injection) для локальных адресов
SecRule REMOTE_ADDR "@ipMatch 127.0.0.1,::1" "id:10001,phase:1,pass,nolog,ctl:ruleRemoveById=942100"

# Правило 3: Запретить PHPi с localhost, но разрешить извне
# Блокируем запрос, если он пришел с localhost И содержит php://
SecRule REMOTE_ADDR "@ipMatch 127.0.0.1,::1" "id:10003,phase:2,deny,status:403,msg:'[ParTricle] PHPi blocked from localhost',chain"
    SecRule ARGS "@rx (?i)php://" "t:none,t:urlDecodeUni"

# Правило 4: Запретить загрузку файлов весом более 1МБ (1048576 байт)
# Срабатывает в фазе 1, проверяем заголовок Content-Length для multipart запросов
SecRule REQUEST_HEADERS:Content-Type "@contains multipart/form-data" "id:10004,phase:1,chain,deny,status:413,msg:'[ParTricle] Upload > 1MB blocked'"
    SecRule REQUEST_HEADERS:Content-Length "@gt 1048576" "t:none"
