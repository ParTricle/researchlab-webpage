# Правило 2: Запретить SQLi в поле авторизации (login.php) с любых адресов
# Усиливаем проверку для URI, содержащего login.php (фаза 2, проверка тела запроса)
SecRule REQUEST_URI "@contains /login.php" "id:10002,phase:2,deny,status:403,msg:'[ParTricle] SQLi in login form strictly blocked',chain"
    SecRule REQUEST_BODY "@rx (?i)(union|select|insert|drop|delete|')" "t:none,t:urlDecodeUni"
