# ---------------------------------------------------------
# ЗАДАНИЕ 5: СОБСТВЕННЫЕ ПРАВИЛА WAF
# ---------------------------------------------------------

# Правило 1: Разрешить SQLi в GET параметре с localhost, запретить с других
# Отключаем правило CRS 942100 (SQLi) для локальных адресов
SecRule REMOTE_ADDR "@ipMatch 127.0.0.1,::1" "id:10001,phase:1,pass,nolog,ctl:ruleRemoveTargetById=942100;ARGS"

# Правило 2: Запретить SQLi в поле авторизации (login.php) с любых адресов
SecRule REQUEST_URI "@contains /login.php" "id:10002,phase:2,deny,status:403,msg:'[ParTricle] SQLi in login blocked',chain"
    SecRule REQUEST_BODY "@rx (?i)(union|select|insert|drop|delete)" "t:none,t:urlDecodeUni"

# Правило 3: Разрешить PHPi извне, запретить с localhost
SecRule REMOTE_ADDR "@ipMatch 127.0.0.1,::1" "id:10003,phase:2,deny,status:403,msg:'[ParTricle] PHPi blocked from localhost',chain"
    SecRule ARGS "@rx (?i)php://" "t:none,t:urlDecodeUni"

# Правило 4: Запретить загрузку файлов весом более 1МБ (1048576 байт)
SecRule REQUEST_HEADERS:Content-Length "@gt 1048576" "id:10004,phase:1,deny,status:413,msg:'[ParTricle] Upload > 1MB blocked'"
